name: Functions CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/radar-core-v1]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Firestore emulator integration test
        working-directory: .
        run: npx --yes firebase-tools@15.29.0 emulators:exec --only firestore --project ai-stock-radar-test "cd functions && npm run test:emulator"
