name: Functions CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/radar-core-v1]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
